---
name: OSS Compliance Validation

on:
  push:
    branches: ["main"]
    paths:
      - "**/*-lock.json"
      - "**/*-lock.*"
      - "**/*.lock"
      - ".github/workflows/*.yml"
      - ".grant.yml"
      - ".syft.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/*-lock.json"
      - "**/*-lock.*"
      - "**/*.lock"
      - ".github/workflows/*.yml"
      - ".grant.yml"
      - ".syft.yml"
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  oss-grant-check:
    name: OSS Grant Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Grant
        run: |
          curl -sSfL https://get.anchore.io/grant | sudo sh -s -- -b /usr/local/bin

      - name: Verify Grant Installation
        run: grant --version

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          output-file: sbom.spdx.json
          format: spdx-json
          upload-artifact: false
          config: .syft.yml

      - name: Run OSS Grant Check on SBOM
        run: grant check sbom.spdx.json -c ./.grant.yml
